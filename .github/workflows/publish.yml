name: publish

# Publishes to npm when a version tag is pushed: `git tag v0.1.10 && git push origin v0.1.10`.
# Authentication is npm Trusted Publishing (OIDC): the package trusts this
# repository and this workflow file, so no token or secret is stored anywhere.
# setup-node is intentionally used WITHOUT `registry-url`: that option writes an
# .npmrc with `_authToken=${NODE_AUTH_TOKEN}`, and an unresolvable token line
# makes npm attempt token auth instead of the OIDC exchange.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm verify this run's identity and mint a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Toolchain
        run: |
          node -v
          npm -v
          echo "registry=$(npm config get registry)"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}"

      - name: Build and verify
        run: |
          node --disable-warning=ExperimentalWarning scripts/build.mjs
          node scripts/check.mjs
          node --disable-warning=ExperimentalWarning --test test/model.test.ts

      - name: Publish
        run: npm publish --access public --provenance
